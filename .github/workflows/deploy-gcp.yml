name: Deploy to Google Cloud (Cloud Run & BigQuery)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      deploy_gcs_frontend:
        description: 'Deploy frontend to Cloud Storage bucket in addition to Cloud Run'
        type: boolean
        default: false
      gcs_bucket_name:
        description: 'GCS Bucket name (required if deploy_gcs_frontend is true)'
        type: string
        default: ''

env:
  GCP_REGION: us-central1
  SERVICE_NAME: poultry-farm-app
  ARTIFACT_REPO: poultry-farm-repo
  BIGQUERY_DATASET: poultry_farm

jobs:
  deploy:
    name: Build & Deploy to Google Cloud
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Authenticate with Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 2. Setup Cloud SDK
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 3. Setup Python for BigQuery schema migration
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Migration Dependencies
        run: |
          pip install google-cloud-bigquery db-dtypes

      # 4. Initialize BigQuery Dataset & Tables
      - name: Deploy BigQuery Schema
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          BIGQUERY_DATASET: ${{ env.BIGQUERY_DATASET }}
          GCP_REGION: ${{ env.GCP_REGION }}
        run: |
          echo "Deploying BigQuery dataset and schema..."
          python sql/init_bigquery.py "$GCP_PROJECT_ID" "$BIGQUERY_DATASET"

      # 5. Set up Artifact Registry & Configure Docker Authentication
      - name: Configure Artifact Registry
        run: |
          echo "Checking/creating Artifact Registry repository..."
          gcloud artifacts repositories describe ${{ env.ARTIFACT_REPO }} --location=${{ env.GCP_REGION }} >/dev/null 2>&1 || \
          gcloud artifacts repositories create ${{ env.ARTIFACT_REPO }} \
            --repository-format=docker \
            --location=${{ env.GCP_REGION }} \
            --description="Poultry Farm Docker Repository" || true

          echo "Configuring Docker auth for ${{ env.GCP_REGION }}-docker.pkg.dev..."
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # 6. Build and Push Docker Container Image to Artifact Registry
      - name: Build & Push Docker Image
        env:
          IMAGE_TAG: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          echo "Building Docker container image: $IMAGE_TAG"
          docker build -t "$IMAGE_TAG" .
          echo "Pushing image to Artifact Registry..."
          docker push "$IMAGE_TAG"

      # 7. Deploy to Google Cloud Run (Serverless, scale-to-zero)
      - name: Deploy to Cloud Run
        id: deploy_cloud_run
        env:
          IMAGE_TAG: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          echo "Deploying service to Cloud Run..."
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "$IMAGE_TAG" \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 5 \
            --memory 512Mi \
            --cpu 1 \
            --set-env-vars "DATABASE_BACKEND=bigquery,GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},BIGQUERY_DATASET=${{ env.BIGQUERY_DATASET }}" \
            --format "value(status.url)" > cloud_run_url.txt

          URL=$(cat cloud_run_url.txt)
          echo "CLOUD_RUN_URL=$URL" >> $GITHUB_ENV
          echo "Cloud Run deployed successfully: $URL"

      # 8. (Optional) Deploy Static Frontend to Google Cloud Storage
      - name: Deploy Frontend to Cloud Storage
        if: ${{ inputs.deploy_gcs_frontend == true && inputs.gcs_bucket_name != '' }}
        run: |
          chmod +x frontend/deploy-gcs.sh
          ./frontend/deploy-gcs.sh "${{ inputs.gcs_bucket_name }}" "${{ secrets.GCP_PROJECT_ID }}" "${{ env.CLOUD_RUN_URL }}"

      - name: Deployment Summary
        run: |
          echo "=========================================================="
          echo "🚀 Deployment Completed Successfully!"
          echo "🌐 Application URL (Unified Cloud Run): ${{ env.CLOUD_RUN_URL }}"
          echo "📖 Swagger API Docs: ${{ env.CLOUD_RUN_URL }}/apidocs"
          echo "📊 BigQuery Dataset: ${{ env.BIGQUERY_DATASET }}"
          echo "📦 Image Registry: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}"
          echo "💰 Idle Cost: $0.00 (min-instances=0, scales to zero)"
          echo "=========================================================="
